<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign Up - Attendance System</title>
<style>
body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
.register-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 300px; }
h2 { text-align: center; color: #333; }
.form-group { margin-bottom: 15px; }
label { display: block; margin-bottom: 5px; color: #666; }
input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
button { width: 100%; padding: 10px; background-color: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
button:hover { background-color: #45a049; }
.login-link { text-align: center; margin-top: 15px; font-size: 14px; }
.login-link a { color: #2196F3; text-decoration: none; }
</style>
</head>
<body>
<div class="register-container">
<h2>Sign Up</h2>
<!-- Form submission to /register -->
<form action="/register" method="POST">
<div class="form-group">
<label>Full Name:</label>
<input type="text" name="name" placeholder="Enter your full name" required>
</div>
<div class="form-group">
<label>Username:</label>
<input type="text" name="username" placeholder="Choose a username" required>
</div>
<div class="form-group">
<label>Password:</label>
<input type="password" name="password" placeholder="Create a password" required>
</div>
<button type="submit">Register</button>
</form>
<div class="login-link">
Already have an account? <a href="/login">Login here</a>
</div>
</div>
</body>
</html>
