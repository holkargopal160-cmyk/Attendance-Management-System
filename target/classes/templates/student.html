<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance Management System - Student</title>
<!-- FontAwesome icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}
body {
background: linear-gradient(135deg, #0b132b, #1c2541, #3a506b);
color: #fff;
min-height: 100vh;
display: flex;
flex-direction: column;
}
.top-header {
width: 100%;
text-align: center;
padding: 20px 0 10px 0;
font-size: 32px;
font-weight: 800;
color: #ffffff;
letter-spacing: 1px;
text-shadow: 0px 3px 8px rgba(0, 0, 0, 0.6);
}
.container {
display: flex;
flex: 1;
padding: 10px 20px 20px 20px;
gap: 20px;
}
.sidebar {
width: 220px;
padding: 10px;
display: flex;
flex-direction: column;
gap: 12px;
}
.admin-panel-title {
color: #94a3b8; font-size: 13px;
font-weight: 700;
letter-spacing: 1.5px;
margin-bottom: 8px;
text-transform: uppercase;
}
.nav-btn {
background: rgba(255, 255, 255, 0.9);
color: #1e293b;
text-decoration: none;
padding: 12px 18px;
border-radius: 6px;
font-weight: bold;
font-size: 14px;
text-align: left;
display: block;
box-shadow: 0 4px 6px rgba(0,0,0,0.3);
transition: all 0.2s ease-in-out;
letter-spacing: 0.5px;
}
.nav-btn.active, .nav-btn:hover {
background: #cbd5e1;
transform: translateX(3px);
}
.main-content {
flex: 1;
display: flex;
flex-direction: column;
gap: 15px;
min-width: 0;
overflow-x: hidden;
}
.card-box {
background: rgba(255, 255, 255, 0.05);
border: 1px solid rgba(255, 255, 255, 0.1);
border-radius: 8px;
box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
overflow: hidden;
width: 100%;
box-sizing: border-box;
}
.card-header {
background: rgba(255, 255, 255, 0.08);
padding: 12px 20px;
font-size: 16px;
font-weight: bold;
display: flex;
align-items: center;
gap: 10px;
color: #ffffff;
border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}
.card-body {
padding: 20px;
}
.form-grid {
display: grid;
grid-template-columns: repeat(2, 1fr);
gap: 15px 40px;
}
.form-group {
display: flex;
align-items: center;
justify-content: space-between;
}
.form-group label {
font-weight: 600;
font-size: 14px;
color: #e2e8f0;
width: 35%;
}
.form-group input, .form-group select {
width: 62%;
padding: 8px 12px;
border-radius: 4px;
border: 1px solid #475569;
background: rgba(255, 255, 255, 0.95);
color: #000;
font-size: 14px;
outline: none;
}
.action-buttons {
display: flex;
gap: 25px;
margin: 20px 0 10px 0;
justify-content: center;
}
.action-btn {
background: none;
border: none;
color: #fff;
font-size: 15px;
font-weight: bold;
cursor: pointer;
display: flex;
align-items: center;
gap: 8px;
padding: 8px 16px;
border-radius: 5px;
transition: 0.2s;
}
.btn-add { color: #2ea44f; }
.btn-remove { color: #f85149; }
.btn-update { color: #e3b341; }
.btn-clear { color: #38bdf8; }
.btn-view { color: #a855f7; }
.action-btn:hover {
background: rgba(255, 255, 255, 0.1);
}
.search-container {
margin-bottom: 10px;
display: none;
}
.search-input {
width: 100%;
padding: 10px 15px;
border-radius: 6px;
border: 1px solid #38bdf8;
background: #0f172a;
color: #fff;
font-size: 14px;
outline: none;
}
.table-container {
width: 100%;
max-width: 100%;
max-height: 300px;
overflow-x: auto;
overflow-y: auto;
background: rgba(255, 255, 255, 0.03);
border-radius: 8px;
padding: 10px;
border: 1px solid rgba(255, 255, 255, 0.1);
box-sizing: border-box;
}
.table-container::-webkit-scrollbar {
width: 8px;
height: 8px;
}
.table-container::-webkit-scrollbar-thumb {
background: rgba(255, 255, 255, 0.25);
border-radius: 4px;
}
.data-table {
width: 100%;
min-width: 1300px;
border-collapse: collapse;
text-align: left;
font-size: 14px;
white-space: nowrap;
}
.data-table, .data-table th, .data-table td {
border: 1px solid rgba(255, 255, 255, 0.2) !important;
}
.data-table th {
background: rgba(255, 255, 255, 0.12);
padding: 10px 12px;
color: #93c5fd;
font-weight: bold;
position: sticky;
top: 0;
z-index: 2;
}
.data-table td {
padding: 8px 12px;
}
.data-table tbody tr {
cursor: pointer;
transition: background 0.2s;
}
.data-table tbody tr:hover {
background-color: rgba(56, 189, 248, 0.2) !important;
}
.data-table tbody tr.selected-row {
background-color: rgba(46, 164, 79, 0.4) !important;
}
</style>
</head>
<body>
<div class="top-header">
Attendance Management System
</div>
<div class="container">
<!-- Sidebar Navigation -->
<div class="sidebar">
<div class="admin-panel-title">ADMIN PANEL</div>
<a href="/teacher" class="nav-btn">DASHBOARD</a>
<a href="/teacher" class="nav-btn">TEACHER</a>
<a href="/student" class="nav-btn active">STUDENT</a>
<a href="/batch" class="nav-btn">BATCH</a>
<a href="/report" class="nav-btn">REPORT</a>
<a href="/login" class="nav-btn">EXIT</a>
</div>
<!-- Main Content -->
<div class="main-content">
<div class="card-box">
<div class="card-header">
<i class="fa-solid fa-user-graduate"></i> Student Details
</div>
<div class="card-body">
<!-- Form -->
<form th:action="@{/saveStudent}" th:object="${student}" method="post" id="studentForm">
<div class="form-grid">
<div class="form-group">
<label>Student ID</label>
<input type="text" th:field="*{id}" id="studentId" placeholder="Enter ID" required />
</div>
<div class="form-group">
<label>Total Students</label>
<input type="text" th:field="*{totalStudents}" id="totalStudents" placeholder="Total" />
</div>
<div class="form-group">
<label>Student Name</label>
<input type="text" th:field="*{studentName}" id="studentName" placeholder="Enter student name" required />
</div>
<div class="form-group">
<label>Semester Name</label>
<select th:field="*{semesterName}" id="semester">
<option value="">semester....</option>
<option value="Sem-I">Sem-I</option>
<option value="Sem-II">Sem-II</option>
<option value="Sem-III">Sem-III</option>
<option value="Sem-IV">Sem-IV</option>
<option value="Sem-V">Sem-V</option>
<option value="Sem-VI">Sem-VI</option>
</select>
</div>
<div class="form-group">
<label>Student Batch</label>
<select th:field="*{batchCode}" id="studentBatch">
<option value="">Please Select....</option>
<option value="IPRO-201602C">IPRO-201602C</option>
<option value="IPRO-201504D">IPRO-201504D</option>
</select>
</div>
<div class="form-group">
<label>Semester Book</label>
<input type="text" th:field="*{semesterBook}" id="semesterBook" placeholder="e.g. HTML5 - Net" />
</div>

<!-- Student Timing Dropdown Added Here -->
<div class="form-group">
<label>Student Timing</label>
<select th:field="*{timing}" id="studentTiming">
<option value="">Please Select Timing...</option>
<option value="09:00 AM - 11:00 AM">09:00 AM - 11:00 AM</option>
<option value="11:30 AM - 01:30 PM">11:30 AM - 01:30 PM</option>
<option value="03:30 PM - 05:30 PM">03:30 PM - 05:30 PM</option>
<option value="06:00 PM - 08:00 PM">06:00 PM - 08:00 PM</option>
</select>
</div>

<div class="form-group">
<label>Date</label>
<input type="date" th:field="*{date}" id="studentDate" />
</div>
<div class="form-group">
<label>Student Days</label>
<select th:field="*{days}" id="studentDays">
<option value="">Please Select....</option>
<option value="Monday">Monday</option>
<option value="Tuesday">Tuesday</option>
<option value="Wednesday">Wednesday</option>
<option value="Thursday">Thursday</option>
<option value="Friday">Friday</option>
<option value="Saturday">Saturday</option>
<option value="Sunday">Sunday</option>
</select>
</div>
<div class="form-group">
<label>Teacher Name</label>
<input type="text" th:field="*{teacherName}" id="teacherName" placeholder="Enter teacher name" />
</div>
<div class="form-group">
<label>Student Status</label>
<select th:field="*{status}" id="studentStatus">
<option value="present">present</option>
<option value="absent">absent</option>
</select>
</div>
<div class="form-group">
<label>Teacher ID</label>
<input type="text" th:field="*{teacherId}" id="teacherIdField" placeholder="Enter teacher ID" />
</div>
</div>
<!-- Action Buttons -->
<div class="action-buttons">
<button type="submit" class="action-btn btn-add"><i class="fa-solid fa-plus"></i> Add</button>
<button type="button" class="action-btn btn-remove" onclick="deleteRow()"><i class="fa-solid fa-minus"></i> Remove</button>
<button type="button" class="action-btn btn-update" onclick="updateRow()"><i class="fa-solid fa-pen-to-square"></i> Update</button>
<button type="reset" class="action-btn btn-clear" onclick="clearForm()"><i class="fa-solid fa-rotate-right"></i> Clear</button>
<button type="button" class="action-btn btn-view" onclick="viewAllData()"><i class="fa-solid fa-globe"></i> View All</button>
</div>
</form>
</div>
</div>

<!-- Live Search Bar -->
<div class="search-container" id="searchContainer">
<input type="text" id="tableSearchInput" class="search-input" onkeyup="searchStudentTable()" placeholder="Search Student by ID, Name, Batch, Semester...">
</div>

<!-- Table Container -->
<div class="table-container">
<table class="data-table" id="studentTable">
<thead>
<tr>
<th>Student Id</th>
<th>Student Name</th>
<th>Batch Code</th>
<th>Semester Name</th>
<th>Student Days</th>
<th>Student Timing</th>
<th>Student Status</th>
<th>Semester Books</th>
<th>Teacher Name</th>
<th>Teacher Id</th>
<th>Date</th>
</tr>
</thead>
<tbody id="studentTableBody">
<tr th:each="s : ${students}" onclick="selectRow(this)">
<td th:text="${s.id}"></td>
<td th:text="${s.studentName}"></td>
<td th:text="${s.batchCode}"></td>
<td th:text="${s.semesterName}"></td>
<td th:text="${s.days}"></td>
<td th:text="${s.timing}"></td>
<td th:text="${s.status}"></td>
<td th:text="${s.semesterBook}"></td>
<td th:text="${s.teacherName}"></td>
<td th:text="${s.teacherId}"></td>
<td th:text="${s.date}"></td>
</tr>
</tbody>
</table>
</div>
</div>
</div>

<script>
let selectedStudentRow = null;

function selectRow(row) {
    let rows = document.querySelectorAll("#studentTableBody tr");
    rows.forEach(r => r.classList.remove("selected-row"));
    row.classList.add("selected-row");
    selectedStudentRow = row;

    let cells = row.cells;
    if (cells.length >= 11) {
        document.getElementById("studentId").value = cells[0].innerText.trim();
        document.getElementById("studentName").value = cells[1].innerText.trim();
        document.getElementById("studentBatch").value = cells[2].innerText.trim();
        document.getElementById("semester").value = cells[3].innerText.trim();
        document.getElementById("studentDays").value = cells[4].innerText.trim();
        document.getElementById("studentTiming").value = cells[5].innerText.trim();
        document.getElementById("studentStatus").value = cells[6].innerText.trim();
        document.getElementById("semesterBook").value = cells[7].innerText.trim();
        document.getElementById("teacherName").value = cells[8].innerText.trim();
        document.getElementById("teacherIdField").value = cells[9].innerText.trim();
        document.getElementById("studentDate").value = cells[10].innerText.trim();
    }
}

function deleteRow() {
    if (selectedStudentRow) {
        if (confirm("Kya aap is student record ko hatana chahte hain?")) {
            selectedStudentRow.remove();
            clearForm();
        }
    } else {
        alert("Kripya pehle table se kisi row par click karein!");
    }
}

function updateRow() {
    if (selectedStudentRow) {
        selectedStudentRow.cells[0].innerText = document.getElementById("studentId").value;
        selectedStudentRow.cells[1].innerText = document.getElementById("studentName").value;
        selectedStudentRow.cells[2].innerText = document.getElementById("studentBatch").value;
        selectedStudentRow.cells[3].innerText = document.getElementById("semester").value;
        selectedStudentRow.cells[4].innerText = document.getElementById("studentDays").value;
        selectedStudentRow.cells[5].innerText = document.getElementById("studentTiming").value;
        selectedStudentRow.cells[6].innerText = document.getElementById("studentStatus").value;
        selectedStudentRow.cells[7].innerText = document.getElementById("semesterBook").value;
        selectedStudentRow.cells[8].innerText = document.getElementById("teacherName").value;
        selectedStudentRow.cells[9].innerText.value = document.getElementById("teacherIdField").value;
        selectedStudentRow.cells[10].innerText = document.getElementById("studentDate").value;
        alert("Student record successfully update ho gaya!");
        clearForm();
    } else {
        alert("Kripya pehle table se kisi row ko select karein!");
    }
}

function clearForm() {
    selectedStudentRow = null;
    let rows = document.querySelectorAll("#studentTableBody tr");
    rows.forEach(r => r.classList.remove("selected-row"));
}

function viewAllData() {
    let searchBox = document.getElementById("searchContainer");
    if (searchBox) {
        searchBox.style.display = (searchBox.style.display === "block") ? "none" : "block";
    }
}

function searchStudentTable() {
    let input = document.getElementById("tableSearchInput").value.toLowerCase();
    let rows = document.querySelectorAll("#studentTableBody tr");
    rows.forEach(row => {
        let rowText = row.innerText.toLowerCase();
        row.style.display = rowText.includes(input) ? "" : "none";
    });
}
</script>
</body>
</html>
