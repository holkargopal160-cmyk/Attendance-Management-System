<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance Management System - Batch</title>
<!-- FontAwesome icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}
body {
background: #0d1b2a;
background: linear-gradient(135deg, #0b132b, #1c2541, #3a506b);
color: #fff;
min-height: 100vh;
display: flex;
flex-direction: column;
}
.top-header {
width: 100%;
text-align: center;
padding: 20px 0 10px 0;
font-size: 32px;
font-weight: 800;
color: #ffffff;
letter-spacing: 1px;
text-shadow: 0px 3px 8px rgba(0, 0, 0, 0.6);
}
.container {
display: flex;
flex: 1;
padding: 10px 20px 20px 20px;
gap: 20px;
}
.sidebar {
width: 220px;
padding: 10px;
display: flex;
flex-direction: column;
gap: 12px;
}
.admin-panel-title {
color: #94a3b8;
font-size: 13px;
font-weight: 700;
letter-spacing: 1.5px;
margin-bottom: 8px;
text-transform: uppercase;
}
.nav-btn {
background: rgba(255, 255, 255, 0.9);
color: #1e293b;
text-decoration: none;
padding: 12px 18px;
border-radius: 6px;
font-weight: bold;
font-size: 14px;
text-align: left;
display: block;
box-shadow: 0 4px 6px rgba(0,0,0,0.3);
transition: all 0.2s ease-in-out;
letter-spacing: 0.5px;
}
.nav-btn.active, .nav-btn:hover {
background: #cbd5e1;
transform: translateX(3px);
}
.main-content {
flex: 1;
display: flex;
flex-direction: column;
gap: 15px;
overflow: hidden;
}
.card-box {
width: 100%;
flex-shrink: 0;
background: rgba(255, 255, 255, 0.05);
border: 1px solid rgba(255, 255, 255, 0.1);
border-radius: 8px;
box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
}
.card-header {
background: rgba(255, 255, 255, 0.08);
padding: 12px 20px;
font-size: 16px;
font-weight: bold;
display: flex;
align-items: center;
gap: 10px;
color: #ffffff;
border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}
.card-body {
padding: 20px;
}
.form-grid {
display: grid;
grid-template-columns: repeat(2, 1fr);
gap: 15px 40px;
}
.form-group {
display: flex;
align-items: center;
justify-content: space-between;
}
.form-group label {
font-weight: 600;
font-size: 14px;
color: #e2e8f0;
width: 35%;
}
.form-group input, .form-group select {
width: 62%;
padding: 8px 12px;
border-radius: 4px;
border: 1px solid #475569;
background: rgba(255, 255, 255, 0.95);
color: #000;
font-size: 14px;
outline: none;
}
.action-buttons {
display: flex;
gap: 25px;
margin: 20px 0 10px 0;
justify-content: center;
}
.action-btn {
background: none;
border: none;
color: #fff;
font-size: 15px;
font-weight: bold;
cursor: pointer;
display: flex;
align-items: center;
gap: 8px;
padding: 8px 16px;
border-radius: 5px;
transition: 0.2s;
}
.btn-add { color: #2ea44f; }
.btn-remove { color: #f85149; }
.btn-update { color: #e3b341; }
.btn-clear { color: #38bdf8; }
.btn-view { color: #a855f7; }
.action-btn:hover {
background: rgba(255, 255, 255, 0.1);
}
.search-container {
margin-bottom: 10px;
display: none;
}
.search-input {
width: 100%;
padding: 10px 15px;
border-radius: 6px;
border: 1px solid #38bdf8;
background: #0f172a;
color: #fff;
font-size: 14px;
outline: none;
}
.table-container {
width: 100%;
flex: 1;
max-height: 400px;
overflow-x: auto;
overflow-y: auto;
background: rgba(255, 255, 255, 0.03);
border-radius: 8px;
padding: 10px;
border: 1px solid rgba(255, 255, 255, 0.1);
}
.data-table {
width: 100%;
min-width: 1100px;
white-space: nowrap;
border-collapse: collapse;
text-align: left;
font-size: 14px;
}
.data-table, .data-table th, .data-table td {
border: 1px solid rgba(255, 255, 255, 0.2) !important;
}
.data-table th {
background: rgba(255, 255, 255, 0.1);
padding: 10px 12px;
color: #93c5fd;
font-weight: bold;
}
.data-table td {
padding: 10px 12px;
}
.data-table tbody tr {
cursor: pointer;
transition: background 0.2s;
}
.data-table tbody tr:hover {
background-color: rgba(56, 189, 248, 0.2) !important;
}
.data-table tbody tr.selected-row {
background-color: rgba(46, 164, 79, 0.4) !important;
}
</style>
</head>
<body>
<div class="top-header">
Attendance Management System
</div>
<div class="container">
<!-- Sidebar Navigation -->
<div class="sidebar">
<div class="admin-panel-title">ADMIN PANEL</div>
<a href="/teacher" class="nav-btn">DASHBOARD</a>
<a href="/teacher" class="nav-btn">TEACHER</a>
<a href="/student" class="nav-btn">STUDENT</a>
<a href="/batch" class="nav-btn active">BATCH</a>
<a href="/report" class="nav-btn">REPORT</a>
<a href="/login" class="nav-btn">EXIT</a>
</div>
<!-- Main Content Section -->
<div class="main-content">
<div class="card-box">
<div class="card-header">
<i class="fa-solid fa-folder-minus"></i> New Batch
</div>
<div class="card-body">
<!-- Spring Boot Form Submission -->
<form th:action="@{/saveBatch}" th:object="${batch}" method="post" id="batchForm">
<div class="form-grid">
<div class="form-group">
<label>Batch Code</label>
<select th:field="*{batchCode}" id="batchCode" required>
<option value="">IPRO-201602A....</option>
<option value="IPRO-201602A">IPRO-201602A</option>
<option value="IPRO-201602B">IPRO-201602B</option>
<option value="IPRO-201602C">IPRO-201602C</option>
<option value="IPRO-201602D">IPRO-201602D</option>
<option value="IPRO-201602E">IPRO-201602E</option>
<option value="IPRO-201602F">IPRO-201602F</option>
</select>
</div>

<div class="form-group">
<label>Batch Days</label>
<select th:field="*{batchDays}" id="batchDays">
<option value="">Please Select....</option>
<option value="Monday">Monday</option>
<option value="Tuesday">Tuesday</option>
<option value="Wednesday">Wednesday</option>
<option value="Thursday">Thursday</option>
<option value="Friday">Friday</option>
<option value="Saturday">Saturday</option>
<option value="Sunday">Sunday</option>
<option value="MWF">MWF</option>
<option value="TTS">TTS</option>
</select>
</div>

<!-- Batch Time Dropdown Added Here -->
<div class="form-group">
<label>Batch Time</label>
<select th:field="*{batchTime}" id="batchTime">
<option value="">Please Select Time...</option>
<option value="09:00 AM - 11:00 AM">09:00 AM - 11:00 AM</option>
<option value="11:30 AM - 01:30 PM">11:30 AM - 01:30 PM</option>
<option value="03:30 PM - 05:30 PM">03:30 PM - 05:30 PM</option>
<option value="06:00 PM - 08:00 PM">06:00 PM - 08:00 PM</option>
</select>
</div>

<div class="form-group">
<label>Semester Name</label>
<select th:field="*{semesterName}" id="semesterName">
<option value="">Please Select....</option>
<option value="Sem-I">Sem-I</option>
<option value="Sem-II">Sem-II</option>
<option value="Sem-III">Sem-III</option>
<option value="Sem-IV">Sem-IV</option>
<option value="Sem-V">Sem-V</option>
<option value="Sem-VI">Sem-VI</option>
<option value="HDSE-II">HDSE-II</option>
<option value="DISM">DISM</option>
<option value="CPISM">CPISM</option>
<option value="ADSE-II">ADSE-II</option>
</select>
</div>

<div class="form-group">
<label>Batch Book</label>
<input type="text" th:field="*{semesterBook}" id="batchBook" placeholder="Enter Book Name"/>
</div>

<div class="form-group">
<label>Date</label>
<input type="date" th:field="*{date}" id="batchDate">
</div>

<div class="form-group">
<label>Teacher Name</label>
<input type="text" th:field="*{teacherName}" id="teacherName" placeholder="Enter Teacher Name"/>
</div>

<div class="form-group">
<label>Batch Status</label>
<select th:field="*{batchStatus}" id="batchStatus">
<option value="Active">Active</option>
<option value="ON">ON</option>
<option value="OFF">OFF</option>
</select>
</div>
</div>
<!-- Action Buttons -->
<div class="action-buttons">
<button type="submit" class="action-btn btn-add"><i class="fa-solid fa-plus"></i> Add</button>
<button type="button" class="action-btn btn-remove" onclick="deleteRow()"><i class="fa-solid fa-minus"></i> Remove</button>
<button type="button" class="action-btn btn-update" onclick="updateRow()"><i class="fa-solid fa-pen-to-square"></i> Update</button>
<button type="reset" class="action-btn btn-clear" onclick="clearForm()"><i class="fa-solid fa-rotate-right"></i> Clear</button>
<button type="button" class="action-btn btn-view" onclick="viewAllData()"><i class="fa-solid fa-globe"></i> View all</button>
</div>
</form>
</div>
</div>

<!-- Search Bar Container -->
<div class="search-container" id="searchContainer">
<input type="text" id="tableSearchInput" class="search-input" onkeyup="searchBatchTable()" placeholder="Search Batch by Code, Days, Time, Semester...">
</div>

<!-- Data Table Container -->
<div class="table-container">
<table class="data-table" id="batchTable">
<thead>
<tr>
<th>Batch Code</th>
<th>Batch Days</th>
<th>Batch Time</th>
<th>Semester Name</th>
<th>Book Name</th>
<th>Teacher Name</th>
<th>Batch Status</th>
<th>Date</th>
</tr>
</thead>
<tbody>
<!-- Database Data Loop -->
<tr th:each="b : ${batches}" onclick="selectRow(this)">
<td th:text="${b.batchCode}"></td>
<td th:text="${b.batchDays}"></td>
<td th:text="${b.batchTime}"></td>
<td th:text="${b.semesterName}"></td>
<td th:text="${b.semesterBook}"></td>
<td th:text="${b.teacherName}"></td>
<td th:text="${b.batchStatus}"></td>
<td th:text="${b.date}"></td>
</tr>
</tbody>
</table>
</div>
</div>
</div>

<script>
let selectedBatchRow = null;

function selectRow(row) {
    let rows = document.querySelectorAll("#batchTable tbody tr");
    rows.forEach(r => r.classList.remove("selected-row"));
    row.classList.add("selected-row");
    selectedBatchRow = row;

    let cells = row.cells;
    if (cells.length >= 8) {
        document.getElementById("batchCode").value = cells[0].innerText.trim();
        document.getElementById("batchDays").value = cells[1].innerText.trim();
        document.getElementById("batchTime").value = cells[2].innerText.trim();
        document.getElementById("semesterName").value = cells[3].innerText.trim();
        document.getElementById("batchBook").value = cells[4].innerText.trim();
        document.getElementById("teacherName").value = cells[5].innerText.trim();
        document.getElementById("batchStatus").value = cells[6].innerText.trim();
        document.getElementById("batchDate").value = cells[7].innerText.trim();
    }
}

function deleteRow() {
    if (selectedBatchRow) {
        if (confirm("Kya aap is batch record ko hatana chahte hain?")) {
            selectedBatchRow.remove();
            clearForm();
        }
    } else {
        alert("Kripya pehle table se kisi row par click karein!");
    }
}

function updateRow() {
    if (selectedBatchRow) {
        selectedBatchRow.cells[0].innerText = document.getElementById("batchCode").value;
        selectedBatchRow.cells[1].innerText = document.getElementById("batchDays").value;
        selectedBatchRow.cells[2].innerText = document.getElementById("batchTime").value;
        selectedBatchRow.cells[3].innerText = document.getElementById("semesterName").value;
        selectedBatchRow.cells[4].innerText = document.getElementById("batchBook").value;
        selectedBatchRow.cells[5].innerText = document.getElementById("teacherName").value;
        selectedBatchRow.cells[6].innerText = document.getElementById("batchStatus").value;
        selectedBatchRow.cells[7].innerText = document.getElementById("batchDate").value;
        alert("Batch record successfully update ho gaya!");
        clearForm();
    } else {
        alert("Kripya pehle table se kisi row ko select karein!");
    }
}

function clearForm() {
    selectedBatchRow = null;
    let rows = document.querySelectorAll("#batchTable tbody tr");
    rows.forEach(r => r.classList.remove("selected-row"));
}

function viewAllData() {
    let searchContainer = document.getElementById("searchContainer");
    if (searchContainer) {
        searchContainer.style.display = (searchContainer.style.display === "none" || searchContainer.style.display === "") ? "block" : "none";
    }
}

function searchBatchTable() {
    let filter = document.getElementById("tableSearchInput").value.toUpperCase();
    let rows = document.querySelectorAll("#batchTable tbody tr");
    rows.forEach(row => {
        let text = row.innerText.toUpperCase();
        row.style.display = (text.indexOf(filter) > -1) ? "" : "none";
    });
}
</script>
</body>
</html>
