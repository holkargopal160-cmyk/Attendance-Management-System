<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance Management System - Teacher</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}
body {
background: linear-gradient(135deg, #0b132b, #1c2541, #3a506b);
color: #fff;
min-height: 100vh;
display: flex;
flex-direction: column;
}
.top-header {
width: 100%;
text-align: center;
padding: 20px 0 10px 0;
font-size: 32px;
font-weight: 800;
color: #ffffff;
letter-spacing: 1px;
text-shadow: 0px 3px 8px rgba(0, 0, 0, 0.6);
}
.container {
display: flex;
flex: 1;
padding: 10px 20px 20px 20px;
gap: 20px;
}
.sidebar {
width: 220px;
padding: 10px;
display: flex;
flex-direction: column;
gap: 12px;
}
.admin-panel-title {
color: #94a3b8; font-size: 13px;
font-weight: 700;
letter-spacing: 1.5px;
margin-bottom: 8px;
text-transform: uppercase;
}
.nav-btn {
background: rgba(255, 255, 255, 0.9);
color: #1e293b;
text-decoration: none;
padding: 12px 18px;
border-radius: 6px;
font-weight: bold;
font-size: 14px;
text-align: left;
display: block;
box-shadow: 0 4px 6px rgba(0,0,0,0.3);
transition: all 0.2s ease-in-out;
letter-spacing: 0.5px;
}
.nav-btn.active, .nav-btn:hover {
background: #cbd5e1;
transform: translateX(3px);
}
.main-content {
flex: 1;
display: flex;
flex-direction: column;
gap: 15px;
}
.card-box {
background: rgba(255, 255, 255, 0.05);
border: 1px solid rgba(255, 255, 255, 0.1);
border-radius: 8px;
box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
overflow: hidden;
}
.card-header {
background: rgba(255, 255, 255, 0.08);
padding: 12px 20px;
font-size: 16px;
font-weight: bold;
display: flex;
align-items: center;
gap: 10px;
color: #ffffff;
border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}
.card-body {
padding: 25px 20px;
}
.form-grid {
display: grid;
grid-template-columns: repeat(2, 1fr);
gap: 18px 40px;
}
.form-group {
display: flex;
align-items: center;
justify-content: space-between;
}
.form-group label {
font-weight: 600;
font-size: 14px;
color: #e2e8f0;
width: 35%;
}
.form-group input, .form-group select {
width: 62%;
padding: 8px 12px;
border-radius: 4px;
border: 1px solid #475569;
background: rgba(255, 255, 255, 0.95);
color: #000;
font-size: 14px;
outline: none;
}
.form-group input.read-only-id {
background: rgba(255, 255, 255, 0.2);
color: #fbbf24;
font-weight: bold;
border: none;
}
.action-buttons {
display: flex;
gap: 25px;
margin: 25px 0 10px 0;
justify-content: center;
}
.action-btn {
background: none;
border: none;
color: #fff;
font-size: 15px;
font-weight: bold;
cursor: pointer;
display: flex;
align-items: center;
gap: 8px;
padding: 8px 16px;
border-radius: 5px;
transition: 0.2s;
}
.btn-add { color: #2ea44f; }
.btn-remove { color: #f85149; }
.btn-update { color: #e3b341; }
.btn-clear { color: #38bdf8; }
.btn-view { color: #22c55e; }
.action-btn:hover {
background: rgba(255, 255, 255, 0.1);
transform: translateY(-2px);
}
.search-container {
margin-bottom: 10px;
display: none;
}
.search-input {
width: 100%;
padding: 10px 15px;
border-radius: 6px;
border: 1px solid #38bdf8;
background: #0f172a;
color: #fff;
font-size: 14px;
outline: none;
}
.table-container {
width: 100%;
max-height: 300px;
overflow: auto;
background: rgba(255, 255, 255, 0.03);
border-radius: 8px;
padding: 10px;
border: 1px solid rgba(255, 255, 255, 0.1);
box-sizing: border-box;
}
.data-table {
width: 100%;
min-width: 1100px;
border-collapse: collapse;
text-align: left;
font-size: 14px;
white-space: nowrap;
}
.data-table, .data-table th, .data-table td {
border: 1px solid rgba(255, 255, 255, 0.2) !important;
}
.data-table th {
background: rgba(255, 255, 255, 0.12);
padding: 10px 12px;
color: #93c5fd;
font-weight: bold;
position: sticky;
top: 0;
z-index: 2;
}
.data-table td {
padding: 8px 12px;
}
.data-table tbody tr {
cursor: pointer;
}
.data-table tbody tr:hover {
background-color: rgba(56, 189, 248, 0.2) !important;
}
.data-table tbody tr.selected-row {
background-color: rgba(46, 164, 79, 0.4) !important;
}
</style>
</head>
<body>
<div class="top-header">
Attendance Management System
</div>
<div class="container">
<!-- Sidebar Navigation -->
<div class="sidebar">
<div class="admin-panel-title">ADMIN PANEL</div>
<a href="/teacher" class="nav-btn">DASHBOARD</a>
<a href="/teacher" class="nav-btn active">TEACHER</a>
<a href="/student" class="nav-btn">STUDENT</a>
<a href="/batch" class="nav-btn">BATCH</a>
<a href="/report" class="nav-btn">REPORT</a>
<a href="/login" class="nav-btn">EXIT</a>
</div>

<!-- Main Content -->
<div class="main-content">
<div class="card-box">
<div class="card-header">
<i class="fa-solid fa-address-card"></i> New Teacher
</div>
<div class="card-body">
<!-- Form for Database Saving -->
<form th:action="@{/saveTeacher}" th:object="${teacher}" method="post" id="teacherForm">
<div class="form-grid">
<div class="form-group">
<label>Teacher ID</label>
<input type="text" th:field="*{teacherId}" id="teacherId" class="read-only-id" placeholder="ID">
</div>
<div class="form-group">
<label>Teacher Name</label>
<input type="text" th:field="*{teacherName}" id="teacherName" placeholder="Enter teacher name" required>
</div>
<div class="form-group">
<label>User Name</label>
<input type="text" th:field="*{userName}" id="userName" placeholder="Enter username" required>
</div>
<div class="form-group">
<label>Password</label>
<input type="password" th:field="*{teacherPassword}" id="teacherPassword" placeholder="Enter password" required>
</div>
<div class="form-group">
<label>Teacher Status</label>
<select th:field="*{teacherStatus}" id="teacherStatus">
<option value="absent">absent</option>
<option value="present">present</option>
</select>
</div>
<div class="form-group">
<label for="teacherDate">Date</label>
<input type="date" th:field="*{date}" id="teacherDate" class="form-control" required>
</div>
</div>
<!-- Action Buttons (Add, Remove, Update, Clear, View all) -->
<div class="action-buttons">
<button type="submit" class="action-btn btn-add"><i class="fa-solid fa-plus-circle"></i> Add</button>
<button type="button" class="action-btn btn-remove" onclick="deleteRow()"><i class="fa-solid fa-minus-circle"></i> Remove</button>
<button type="button" class="action-btn btn-update" onclick="updateRow()"><i class="fa-solid fa-pen-to-square"></i> Update</button>
<button type="reset" class="action-btn btn-clear" onclick="clearForm()"><i class="fa-solid fa-arrows-rotate"></i> Clear</button>
<button type="button" class="action-btn btn-view" onclick="viewAllData()"><i class="fa-solid fa-bullseye"></i> View all</button>
</div>
</form>
</div>
</div>

<!-- Search Bar -->
<div class="search-container" id="searchContainer">
<input type="text" id="tableSearchInput" class="search-input" onkeyup="searchTeacherTable()" placeholder="Search Teacher by ID, Name, Username or Status...">
</div>

<!-- Table Container -->
<div class="container-table table-container">
<table class="data-table" id="teacherTable">
<thead>
<tr>
<th>Teacher Id</th>
<th>User Name</th>
<th>Teacher Name</th>
<th>Teacher Password</th>
<th>Teacher Status</th>
<th>Teacher Date</th>
</tr>
</thead>
<tbody>
<!-- Database Data Loop -->
<tr th:each="t : ${teachers}" onclick="selectRow(this)">
<td th:text="${t.teacherId}"></td>
<td th:text="${t.userName}"></td>
<td th:text="${t.teacherName}"></td>
<td th:text="${t.teacherPassword}"></td>
<td th:text="${t.teacherStatus}"></td>
<td th:text="${t.date}"></td>
</tr>
</tbody>
</table>
</div>
</div>
</div>

<script>
let selectedRow = null;

// Row click karne par form me data auto-fill ho jayega
function selectRow(row) {
    let rows = document.querySelectorAll("#teacherTable tbody tr");
    rows.forEach(r => r.classList.remove("selected-row"));
    row.classList.add("selected-row");
    selectedRow = row;

    let cells = row.cells;
    if(cells.length >= 6) {
        document.getElementById("teacherId").value = cells[0].innerText.trim();
        document.getElementById("userName").value = cells[1].innerText.trim();
        document.getElementById("teacherName").value = cells[2].innerText.trim();
        document.getElementById("teacherPassword").value = cells[3].innerText.trim();
        document.getElementById("teacherStatus").value = cells[4].innerText.trim();
        document.getElementById("teacherDate").value = cells[5].innerText.trim();
    }
}

// Remove button click
function deleteRow() {
    if(selectedRow) {
        if(confirm("Kya aap is record ko hatana chahte hain?")) {
            selectedRow.remove();
            clearForm();
        }
    } else {
        alert("Kripya pehle table se kisi row par click karein!");
    }
}

// Update button click
function updateRow() {
    if(selectedRow) {
        selectedRow.cells[0].innerText = document.getElementById("teacherId").value;
        selectedRow.cells[1].innerText = document.getElementById("userName").value;
        selectedRow.cells[2].innerText = document.getElementById("teacherName").value;
        selectedRow.cells[3].innerText = document.getElementById("teacherPassword").value;
        selectedRow.cells[4].innerText = document.getElementById("teacherStatus").value;
        selectedRow.cells[5].innerText = document.getElementById("teacherDate").value;
        alert("Record successfully update ho gaya!");
        clearForm();
    } else {
        alert("Kripya pehle table se kisi row ko select karein!");
    }
}

function clearForm() {
    selectedRow = null;
    let rows = document.querySelectorAll("#teacherTable tbody tr");
    rows.forEach(r => r.classList.remove("selected-row"));
}

function viewAllData() {
    let searchContainer = document.getElementById("searchContainer");
    if (searchContainer) {
        searchContainer.style.display = (searchContainer.style.display === "none" || searchContainer.style.display === "") ? "block" : "none";
    }
}

function searchTeacherTable() {
    let filter = document.getElementById("tableSearchInput").value.toUpperCase();
    let rows = document.querySelectorAll("#teacherTable tbody tr");
    rows.forEach(row => {
        let text = row.innerText.toUpperCase();
        row.style.display = text.indexOf(filter) > -1 ? "" : "none";
    });
}
</script>
</body>
</html>
