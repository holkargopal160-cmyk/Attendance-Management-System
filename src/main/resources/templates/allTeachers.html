<!DOCTYPE html>
<html>
<head>
<title>All Teachers Data</title>
<style>
body { font-family: sans-serif; padding: 20px; }
#searchInput { padding: 10px; width: 300px; margin-bottom: 20px; }
table { width: 100%; border-collapse: collapse; }
th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
</style>
</head>
<body>
<div style="display: flex; align-items: center; gap: 15px; margin-bottom: 20px;">
<!-- Is code ko purane button ki jagah badal dein -->
<button onclick="window.location.href='teacher.html'" style="padding: 8px 15px; background-color: #34495e; color: white; border: none; cursor:
pointer; font-size: 18px; font-weight: bold; border-radius: 4px; display: flex; align-items: center; justify-content: center;">
⬅ Back
</button>
</div>
<h2>Teachers List</h2>
<input type="text" id="searchInput" onkeyup="searchTable()" placeholder="Search by name or ID...">
<table id="teacherTable">
<thead>
<tr><th>ID</th><th>User Name</th><th>Teacher Name</th><th>Status</th></tr>
</thead>
<tbody id="allTableBody"></tbody>
</table>
<script>
// Page load hote hi data dikhayein
let data = JSON.parse(localStorage.getItem("myTeachersData")) || [];
let tbody = document.getElementById("allTableBody");
data.forEach(item => {
tbody.innerHTML += `<tr><td>${item.id}</td><td>${item.user}</td><td>${item.name}</td><td>${item.status}</td></tr>`;
});
// Search Functionality
function searchTable() {
let filter = document.getElementById("searchInput").value.toUpperCase();
let rows = tbody.getElementsByTagName("tr");
for (let i = 0; i < rows.length; i++) {
let text = rows[i].innerText.toUpperCase();
rows[i].style.display = text.indexOf(filter) > -1 ? "" : "none";
}
}
</script>
</body>
</html>
